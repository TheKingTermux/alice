name: Security PR

on:
  pull_request:
    types: [opened, synchronize, closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  process-security-pr:
    # 1. GERBANG DIBUKA: Terima semua PR Dependabot, ATAU PR Renovate yang judulnya ada 'security'
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.pull_request.user.login == 'renovate[bot]' && contains(github.event.pull_request.title, 'security'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # 🤖 LANGKAH TAMBAHAN: Generate token khusus untuk bot Anda
      - name: Generate Bot Token
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }} # Menggunakan client-id terbaru
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Extract info & Create/Update Issue
        uses: actions/github-script@v9
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          github-token: ${{ steps.get_bug_bot_token.outputs.token }}
          script: |
            const payload = context.payload;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prBody = process.env.PR_BODY || payload.pull_request.body || '';
            const prTitle = process.env.PR_TITLE || payload.pull_request.title || '';
            const author = process.env.PR_AUTHOR || '';
            const botType = author === 'renovate[bot]' ? 'Renovate' : 'Dependabot';

            // ==========================================
            // STRATEGI TAMBAHAN 1: Multi-Pattern ID Extractors (Super Lengkap)
            // ==========================================
            
            // 1. GHSA ID
            const ghsaMatch = prBody.match(/(GHSA-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4})/i) || prTitle.match(/(GHSA-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4})/i);
            let ghsa = ghsaMatch ? ghsaMatch[1].toUpperCase() : 'No GHSA';
            
            // 2. CVE ID
            const cveMatch = prBody.match(/(CVE-\d{4}-\d{4,7})/i) || prTitle.match(/(CVE-\d{4}-\d{4,7})/i);
            let cve = cveMatch ? cveMatch[1].toUpperCase() : 'No CVE';

            // 3. CWE ID (Common Weakness Enumeration)
            const cweMatch = prBody.match(/(CWE-\d+)/i) || prTitle.match(/(CWE-\d+)/i);
            let extractedCwe = cweMatch ? cweMatch[1].toUpperCase() : null;

            // 4. Alternate OSV/Ecosystem ID (Snyk, NPM, RustSec, PySec, Go, dll)
            const osvMatch = prBody.match(/(SNYK-[a-zA-Z0-9-]+|NPM-\d+-\d+|RUSTSEC-\d{4}-\d+|PYSEC-\d{4}-\d+|GO-\d{4}-\d+)/i);
            let osvId = osvMatch ? osvMatch[1].toUpperCase() : 'No Alt ID';

            // Deteksi nama paket kerentanan (Diperkuat dengan pola ganda)
            let pkg = 'Unknown';
            const pkgMatch = prTitle.match(/(?:bumps?|updates?)\s+(?:dependency\s+)?([^\s]+)/i) || 
                             prBody.match(/(?:bumps?|updates?)\s+(?:dependency\s+)?([^\s]+)\s+from/i);
            if (pkgMatch) pkg = pkgMatch[1].replace(/[`'"]/g, '');

            const depBlockMatch = prBody.match(/updated-dependencies:([\s\S]*?)(?=\n---|$)/);
            if (depBlockMatch) {
              const block = depBlockMatch[1];
              const nameMatch = block.match(/dependency-name:\s*["']?([^"'\n]+)["']?/);
              if (nameMatch && (pkg === 'Unknown' || !pkg)) pkg = nameMatch[1].trim();
            }

            // Inisialisasi variabel penampung data
            let severity = 'UNKNOWN';
            let cvss = 'N/A';
            let vectorString = 'N/A'; // Menampung kode mentah metrik CVSS
            let title = `Security Update: ${pkg} (${ghsa !== 'No GHSA' ? ghsa : (cve !== 'No CVE' ? cve : osvId)})`;
            let summaryDesc = `${botType} security update detected.`;
            let cweList = extractedCwe ? extractedCwe : 'N/A';
            let vulnRange = 'Unknown';
            let patched = 'None';

            // ==========================================
            // STRATEGI TAMBAHAN 2: Fetch Ganda (Public Advisory API)
            // ==========================================
            if (ghsa !== 'No GHSA') {
              try {
                console.log(`🔍 Mengambil data kerentanan resmi untuk ${ghsa} via Public API...`);
                const advResponse = await fetch(`https://api.github.com/advisories/${ghsa}`);
                
                if (advResponse.ok) {
                  const advData = await advResponse.json();
                  
                  if (advData.summary) title = advData.summary;
                  if (advData.description) summaryDesc = advData.description;
                  if (advData.severity) severity = advData.severity.toUpperCase();
                  if (advData.cvss && advData.cvss.score) cvss = advData.cvss.score.toString();
                  if (advData.cvss && advData.cvss.vector_string) vectorString = advData.cvss.vector_string;

                  if (advData.cwes && advData.cwes.length > 0) {
                    cweList = advData.cwes.map(c => `${c.cwe_id} (${c.name})`).join(', ');
                  }

                  if (advData.vulnerabilities && advData.vulnerabilities.length > 0) {
                    let ranges = [];
                    let fixes = [];
                    advData.vulnerabilities.forEach(v => {
                      if (v.vulnerable_version_range) ranges.push(v.vulnerable_version_range);
                      if (v.first_patched_version) fixes.push(v.first_patched_version);
                    });
                    if (ranges.length > 0) vulnRange = ranges.join('\n  - ');
                    if (fixes.length > 0) patched = fixes.join(' / ');
                  }
                  console.log(`✅ Data berhasil diamankan dari Public API.`);
                } else {
                  console.log(`⚠️ Public API ditolak (Status: ${advResponse.status}). Mencoba metode investigasi cadangan...`);
                }
              } catch (apiError) {
                console.log(`⚠️ Gagal fetch Public API (${apiError.message}).`);
              }
            }

            // ==========================================
            // STRATEGI TAMBAHAN 3: Penerjemah CVSS Vector String ke Format Teks
            // ==========================================
            function parseCvssVector(vector) {
              if (!vector || vector === 'N/A') return '*Data metrik belum dipublikasikan oleh repositori database.*';
              const map = {
                'AV:N': 'Network', 'AV:A': 'Adjacent', 'AV:L': 'Local', 'AV:P': 'Physical',
                'AC:L': 'Low', 'AC:H': 'High',
                'PR:N': 'None', 'PR:L': 'Low', 'PR:H': 'High',
                'UI:N': 'None', 'UI:R': 'Required',
                'S:U': 'Unchanged', 'S:C': 'Changed',
                'C:N': 'None', 'C:L': 'Low', 'C:H': 'High',
                'I:N': 'None', 'I:L': 'Low', 'I:H': 'High',
                'A:N': 'None', 'A:L': 'Low', 'A:H': 'High'
              };
              const parts = vector.replace(/^CVSS:3\.[01]\//, '').split('/');
              let result = `**Vector:** \`${vector}\`\n`;
              parts.forEach(p => {
                const [k, v] = p.split(':');
                if (map[`${k}:${v}`]) {
                  const name = k === 'AV' ? 'Attack vector' : k === 'AC' ? 'Attack complexity' : k === 'PR' ? 'Privileges required' : k === 'UI' ? 'User interaction' : k === 'S' ? 'Scope' : k === 'C' ? 'Confidentiality' : k === 'I' ? 'Integrity' : k === 'A' ? 'Availability' : k;
                  result += `- **${name}:** ${map[`${k}:${v}`]}\n`;
                }
              });
              return result;
            }

            const cvssMetrics = parseCvssVector(vectorString);

            // Fallback investigasi teks jika API belum siap
            if (severity === 'UNKNOWN') {
              const severityMatch = prBody.match(/\*\*Severity:\*\*\s*(\w+)/i) || prBody.match(/Severity:\s*(\w+)/i);
              if (severityMatch) severity = severityMatch[1].toUpperCase();
            }

            if (title.startsWith('Security Update:')) {
               if (severity !== 'UNKNOWN' && (cve !== 'No CVE' || osvId !== 'No Alt ID')) {
                 title = `Security: ${severity} - ${pkg} (${ghsa !== 'No GHSA' ? ghsa : (cve !== 'No CVE' ? cve : osvId)})`;
               } else {
                 title = `Security Advisory: ${pkg} (${ghsa !== 'No GHSA' ? ghsa : 'Unknown ID'})`;
               }
            }

            if (botType === 'Dependabot' && severity === 'UNKNOWN' && ghsa === 'No GHSA' && cve === 'No CVE' && osvId === 'No Alt ID') {
              console.log('✅ PR Dependabot ini adalah update versi normal. Melewati pembuatan Issue...');
              return; 
            }

            let issueLabels = ['Security', 'Auto Create Issues', 'dependencies'];
            let severityLabel = 'Low';
            
            if (severity === 'CRITICAL') {
              severityLabel = 'Critical';
            } else if (severity === 'HIGH') {
              severityLabel = 'High';
            } else if (severity === 'MODERATE') {
              severityLabel = 'Moderate';
            } else {
              severityLabel = 'Low';
              severity = 'LOW';
            }
            issueLabels.push(severityLabel);

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'all', labels: 'Auto Create Issues', per_page: 100 }
            );
            const existing = issues.find(i => i.title === title);

            const body = `## 🛡️ Security Vulnerability (from ${botType} PR #${process.env.PR_NUMBER})

            ### Description
            ${summaryDesc}
            
            ### Severity Check
            - ${severity === 'LOW' ? '☑' : '☐'} Low
            - ${severity === 'MODERATE' ? '☑' : '☐'} Moderate
            - ${severity === 'HIGH' ? '☑' : '☐'} High
            - ${severity === 'CRITICAL' ? '☑' : '☐'} Critical
            
            ### Severity Score
            ${cvss} / 10

            ### CVSS v3 Base Metrics
            ${cvssMetrics}
            
            ### Identifiers
            - **GHSA ID:** ${ghsa}
            - **CVE ID:** ${cve}
            - **Alt ID (OSV/Snyk):** ${osvId}
            
            ### Weaknesses
            - ${cweList}
            
            ### Affected
            - **Package:** ${pkg}
            - **Affected versions:**
              - ${vulnRange}
            - **Patched versions:** ${patched}
            
            ### References
            - Advisory: https://github.com/advisories/${ghsa}
            - PR: ${process.env.PR_URL}
            
            ---
            _Auto-generated from ${botType} security PR. Fix by merging PR #${process.env.PR_NUMBER}._`;

            let issueNumber = null;

            if (payload.action === 'opened' || payload.action === 'synchronize' || payload.action === 'reopened') {
              if (!existing) {
                const createdIssue = await github.rest.issues.create({
                  owner, repo, title, body,
                  labels: issueLabels,
                  assignees: ['TheKingTermux'],
                  milestone: 1
                });
                issueNumber = createdIssue.data.number;
                console.log(`Created issue #${issueNumber}: ${title}`);
              } else {
                await github.rest.issues.update({
                  owner, repo,
                  issue_number: existing.number,
                  body, state: 'open', milestone: 1
                });
                const currentLabels = existing.labels.map(l => l.name);
                const missingLabels = issueLabels.filter(l => !currentLabels.includes(l));
                if (missingLabels.length > 0) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: existing.number, labels: missingLabels });
                }
                issueNumber = existing.number;
                console.log(`Updated issue #${issueNumber}: ${title}`);
              }

              if (issueNumber) {
                const closingKeywordRegex = new RegExp(`(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\\s+#${issueNumber}\\b`, 'i');
                if (!closingKeywordRegex.test(prBody)) {
                  const newPrBody = prBody + `\n\n---\n**🛡️ Auto-linked Security Task:** Closes #${issueNumber}`;
                  await github.rest.pulls.update({ owner, repo, pull_number: process.env.PR_NUMBER, body: newPrBody });
                }
              }
            }

            if (payload.action === 'closed' && existing) {
              const labels = existing.labels.map(l => l.name);
              if (!labels.includes('do-not-autoclose')) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
                console.log(`Closed issue: ${title}`);
              }
            }
