name: Sync Security Advisories

on:
  schedule:
    - cron: '0 0 * * 0' # Setiap Minggu jam 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-advisories:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Sync Old Issues with Latest Advisory Data
        id: sync_task
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log("🔍 Mengambil semua tiket Issue Keamanan...");
            
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: 'Auto Create Issues', per_page: 100
            });

            console.log(`Ditemukan ${issues.length} tiket untuk disinkronisasi.`);

            let updatedCount = 0;
            let syncedCount = 0;
            let failedCount = 0;

            for (const issue of issues) {
              const oldBody = issue.body || '';
              const currentLabels = issue.labels.map(l => l.name);
              
              // 1. Ekstrak GHSA ID
              const ghsaMatch = oldBody.match(/\*\*GHSA ID:\*\*\s*(GHSA-[A-Z0-9-]+)/i);
              if (!ghsaMatch) {
                syncedCount++; 
                continue; 
              }
              const ghsa = ghsaMatch[1].toUpperCase();
              console.log(`\n⏳ Menyelaraskan Issue #${issue.number} (${ghsa})...`);

              // 2. Deteksi Jenis Issue (Dari Alert atau dari PR)
              let sourceUrl = '';
              let sourceNumber = '';
              let sourceType = 'PR'; // Default: berasal dari Pull Request
              
              // Cek apakah ini berasal dari Dependabot Alerts (bot TheKingTermux)
              const alertMatch = oldBody.match(/\[Dependabot Alert #(\d+)\]\((https:\/\/[^\s\)]+)\)/i);
              if (alertMatch) {
                sourceType = 'Alert';
                sourceNumber = alertMatch[1];
                sourceUrl = alertMatch[2];
              } else {
                // Jika dari PR
                const prMatch = oldBody.match(/PR #(\d+)/i) || [];
                sourceNumber = prMatch[1] || 'Unknown';
                const urlMatch = oldBody.match(/- PR: (https:\/\/github.com\/[^\s]+)/i) || [];
                sourceUrl = urlMatch[1] || `https://github.com/${owner}/${repo}/pull/${sourceNumber}`;
              }

              const pkgMatch = oldBody.match(/\*\*Package:\*\*\s*`?([^\n`]+)`?/i) || [];
              const pkg = pkgMatch[1] ? pkgMatch[1].trim() : 'Unknown';
              
              const osvMatch = oldBody.match(/\*\*Alt ID \(OSV\/Snyk\):\*\*\s*([^\n]+)/i) || [];
              const osvId = osvMatch[1] || 'No Alt ID';

              let title = issue.title;
              let descText = 'No description available.';
              let severity = 'UNKNOWN';
              let cvss = 'N/A';
              let vectorString = 'N/A';
              let cve = 'No CVE';
              let cweList = 'N/A';
              let vulnRange = 'Unknown';
              let patched = 'None';

              try {
                // 3. Tarik Data Terbaru pakai Octokit (Anti Rate-Limit)
                const advResponse = await github.request('GET /advisories/{ghsa_id}', { ghsa_id: ghsa });
                const advData = advResponse.data;

                title = advData.summary || title;
                descText = advData.description || descText;
                severity = advData.severity ? advData.severity.toUpperCase() : severity;
                cvss = advData.cvss && advData.cvss.score ? advData.cvss.score.toString() : cvss;
                vectorString = advData.cvss && advData.cvss.vector_string ? advData.cvss.vector_string : vectorString;
                cve = advData.cve_id || cve;
                
                if (advData.cwes && advData.cwes.length > 0) {
                  cweList = advData.cwes.map(c => `- **${c.cwe_id}**: ${c.name}`).join('\n');
                }

                if (advData.vulnerabilities && advData.vulnerabilities.length > 0) {
                  let ranges = []; let fixes = [];
                  advData.vulnerabilities.forEach(v => {
                    if (v.package && v.package.name === pkg) {
                      if (v.vulnerable_version_range) ranges.push(v.vulnerable_version_range);
                      if (v.first_patched_version) fixes.push(v.first_patched_version);
                    }
                  });
                  if (ranges.length > 0) vulnRange = ranges.join('\n  - ');
                  if (fixes.length > 0) patched = fixes.join('\n  - ');
                }
              } catch (e) {
                console.log(`⚠️ Gagal fetch dari API Publik: ${e.message}`);
                failedCount++;
                continue; // Skip jika gagal narik data, jangan merusak body yang ada
              }

              if (severity === 'MEDIUM') severity = 'MODERATE';
              if (severity !== 'UNKNOWN' && severity !== 'LOW') {
                 title = `Security: ${severity} - ${pkg} (${ghsa})`;
              }

              // CVSS Parser
              function parseCvssVector(vector) {
                if (!vector || vector === 'N/A') return '*Data metrik belum dipublikasikan oleh repositori database.*';
                const map = { 'AV:N':'Network', 'AV:A':'Adjacent', 'AV:L':'Local', 'AV:P':'Physical', 'AC:L':'Low', 'AC:H':'High', 'PR:N':'None', 'PR:L':'Low', 'PR:H':'High', 'UI:N':'None', 'UI:R':'Required', 'S:U':'Unchanged', 'S:C':'Changed', 'C:N':'None', 'C:L':'Low', 'C:H':'High', 'I:N':'None', 'I:L':'Low', 'I:H':'High', 'A:N':'None', 'A:L':'Low', 'A:H':'High' };
                const parts = vector.replace(/^CVSS:3\.[01]\//, '').split('/');
                let result = `**Vector:** \`${vector}\`\n`;
                parts.forEach(p => { const [k, v] = p.split(':'); if (map[`${k}:${v}`]) { const name = k==='AV'?'Attack vector':k==='AC'?'Attack complexity':k==='PR'?'Privileges required':k==='UI'?'User interaction':k==='S'?'Scope':k==='C'?'Confidentiality':k==='I'?'Integrity':k==='A'?'Availability':k; result += `- **${name}:** ${map[`${k}:${v}`]}\n`; } });
                return result;
              }
              const cvssMetrics = parseCvssVector(vectorString);

              // 4. RANGKAI BODY SESUAI JENIS SUMBER (Alert vs PR)
              let newBody = "";
              
              if (sourceType === 'Alert') {
                newBody = `🚨 **Sumber Peringatan:** [Dependabot Alert #${sourceNumber}](${sourceUrl})

            ### Description
            ${descText}
            
            ### Severity Check
            - [${severity === 'LOW' ? 'x' : ' '}] Low
            - [${severity === 'MODERATE' ? 'x' : ' '}] Moderate
            - [${severity === 'HIGH' ? 'x' : ' '}] High
            - [${severity === 'CRITICAL' ? 'x' : ' '}] Critical
            
            ### Severity Score
            ${cvss} / 10

            ### CVSS v3 Base Metrics
            ${cvssMetrics}
            
            ### Identifiers
            - **GHSA ID:** ${ghsa}
            - **CVE ID:** ${cve}
            - **Alt ID (OSV/Snyk):** ${osvId}
            
            ### Weaknesses
            ${cweList !== 'N/A' ? cweList : '- N/A'}
            
            ### Affected
            - **Package:** \`${pkg}\`
            - **Affected versions:**
              - ${vulnRange}
            - **Patched versions:**
              - ${patched}
            
            ### References
            - Advisory: https://github.com/advisories/${ghsa}
            - Alert Link: ${sourceUrl}
            
            ---
            _Auto-generated from Dependabot Alert. Periksa Alert Link di atas untuk detail atau resolve masalah._`;
              
              } else {
                // Asumsi Source Type adalah 'PR'
                const botTypeDetect = oldBody.match(/from (Dependency Review|Renovate|Dependabot)/i);
                const botName = botTypeDetect ? botTypeDetect[1] : 'Dependency Review';
                
                const prIntro = `🚨 **Dependency Review Alert:** Kerentanan diperkenalkan melalui PR #${sourceNumber}.\n\n`;

                newBody = `## 🛡️ Security Vulnerability (from ${botName} PR #${sourceNumber})

            ### Description
            ${prIntro}${descText}
            
            ### Severity Check
            - [${severity === 'LOW' ? 'x' : ' '}] Low
            - [${severity === 'MODERATE' ? 'x' : ' '}] Moderate
            - [${severity === 'HIGH' ? 'x' : ' '}] High
            - [${severity === 'CRITICAL' ? 'x' : ' '}] Critical
            
            ### Severity Score
            ${cvss} / 10

            ### CVSS v3 Base Metrics
            ${cvssMetrics}
            
            ### Identifiers
            - **GHSA ID:** ${ghsa}
            - **CVE ID:** ${cve}
            - **Alt ID (OSV/Snyk):** ${osvId}
            
            ### Weaknesses
            ${cweList !== 'N/A' ? cweList : '- N/A'}
            
            ### Affected
            - **Package:** \`${pkg}\`
            - **Affected versions:**
              - ${vulnRange}
            - **Patched versions:**
              - ${patched}
            
            ### References
            - Advisory: https://github.com/advisories/${ghsa}
            - PR: ${sourceUrl}
            
            ---
            _Auto-generated from ${botName}. Fix by removing or updating the vulnerable package in PR #${sourceNumber}._`;
              }

              // Manajemen Label
              let targetSeverityLabel = 'Low';
              if (severity === 'CRITICAL') targetSeverityLabel = 'Critical';
              else if (severity === 'HIGH') targetSeverityLabel = 'High';
              else if (severity === 'MODERATE') targetSeverityLabel = 'Moderate';

              const severityPool = ['Low', 'Moderate', 'High', 'Critical'];
              let wrongSeverityLabels = currentLabels.filter(l => severityPool.includes(l) && l !== targetSeverityLabel);
              let fixedLabelToAdd = (issue.state === 'closed' && !currentLabels.includes('Fixed'));
              let needLabelUpdate = wrongSeverityLabels.length > 0 || !currentLabels.includes(targetSeverityLabel) || fixedLabelToAdd;

              // 5. Bandingkan dan Update
              if (newBody !== oldBody || needLabelUpdate || title !== issue.title) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, title: title, body: newBody
                });

                for (const wrongLabel of wrongSeverityLabels) {
                  try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: wrongLabel }); } catch (e) {}
                }

                let labelsToPush = [];
                if (!currentLabels.includes(targetSeverityLabel)) labelsToPush.push(targetSeverityLabel);
                if (fixedLabelToAdd) labelsToPush.push('Fixed');

                if (labelsToPush.length > 0) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: labelsToPush });
                }
                
                console.log(`✅ Berhasil! Issue #${issue.number} telah disinkronisasikan.`);
                updatedCount++;
              } else {
                console.log(`➖ Issue #${issue.number} sudah sinkron.`);
                syncedCount++;
              }
            }
            
            core.setOutput('total', issues.length);
            core.setOutput('updated', updatedCount);
            core.setOutput('synced', syncedCount);
            core.setOutput('failed', failedCount);

      - name: Kirim Laporan ke Discord (Scribe Alhaitham)
        if: env.DISCORD_URL != '' && always()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_SCRIBE }}
          TOTAL_ISSUES: ${{ steps.sync_task.outputs.total }}
          UPDATED: ${{ steps.sync_task.outputs.updated }}
          SYNCED: ${{ steps.sync_task.outputs.synced }}
          FAILED: ${{ steps.sync_task.outputs.failed }}
        run: |
          DESC="📖 **Laporan Penyelarasan Akademiya**"$'\n\n'"Pembaruan arsip selesai. Fakta dan logika telah diperbarui."
          
          if [ "$UPDATED" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
            FOOTER_QUOTE="✨ 'Tidak ada anomali yang mengharuskanku untuk lembur hari ini.'"
          else
            FOOTER_QUOTE="📘 'Catatan yang akurat adalah fondasi dari setiap keputusan.'"
          fi

          jq -n \
            --arg title "Base Data Synchronization Processed" \
            --arg desc "$DESC" \
            --arg repo "${{ github.repository }}" \
            --arg total "${TOTAL_ISSUES:-0}" \
            --arg updated "${UPDATED:-0}" \
            --arg synced "${SYNCED:-0}" \
            --arg failed "${FAILED:-0}" \
            --arg footer_text "$FOOTER_QUOTE" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 4569206,
                fields: [
                  { name: "📁 Repositori", value: ("`" + $repo + "`"), inline: false },
                  { name: "🔍 Total Arsip Diperiksa", value: $total, inline: true },
                  { name: "📝 Berhasil Diperbarui", value: $updated, inline: true },
                  { name: "✅ Sudah Sinkron", value: $synced, inline: true },
                  { name: "⚠️ Gagal/Error", value: $failed, inline: true }
                ],
                footer: { text: $footer_text }
              }]
            }' > discord_scribe_payload.json

          curl -H "Content-Type: application/json" -X POST -d @discord_scribe_payload.json "$DISCORD_URL"
          echo "📬 Laporan arsip berhasil dikirim ke saluran Discord!"
