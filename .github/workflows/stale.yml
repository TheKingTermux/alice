name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '23 6 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      # 🤖 LANGKAH TAMBAHAN: Generate token khusus dari GitHub App bot pribadi Anda
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/stale@v11
        with:
          # Ganti GITHUB_TOKEN bawaan dengan token hasil generate bot pribadi
          repo-token: ${{ steps.bot_token.outputs.token }}
          stale-issue-message: 'Isu ini sudah tidak ada perkembangan'
          stale-pr-message: 'Request ini sudah tidak ada perkembangan'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          stale-ignore-label: 'do-not-autoclose'
          exempt-issue-labels: 'do-not-autoclose'
          exempt-pr-labels: 'do-not-autoclose'
          remove-stale-when-updated: 'true'
