name: 'Dependency Review & Security Alert'

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # 1. JALANKAN PENJAGA GERBANG
      - name: 'Dependency Review Check'
        uses: actions/dependency-review-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          fail-on-severity: low

      # 2. JIKA GAGAL: Ekstrak kerentanan dan otomatis buat Issue ala Advisory API
      - name: Extract Vuln & Auto Create Issue
        if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const payload = context.payload;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const prNumber = payload.pull_request.number;
            const prUrl = payload.pull_request.html_url;
            const prAuthor = payload.pull_request.user.login;
            const baseSha = payload.pull_request.base.sha;
            const headSha = payload.pull_request.head.sha;
            const botType = 'Dependency Review';

            console.log(`🔍 Memindai grafik kerentanan antara ${baseSha} dan ${headSha}...`);

            try {
              const compare = await github.request('GET /repos/{owner}/{repo}/dependency-graph/compare/{basehead}', {
                owner, repo, basehead: `${baseSha}...${headSha}`
              });

              let rawVulns = [];
              for (const dep of compare.data) {
                if (dep.vulnerabilities && dep.vulnerabilities.length > 0) {
                  for (const vuln of dep.vulnerabilities) {
                    rawVulns.push({
                      pkg: dep.name,
                      ghsa: vuln.advisory_ghsa_id ? vuln.advisory_ghsa_id.toUpperCase() : null,
                      cve: vuln.advisory_ids ? vuln.advisory_ids.find(id => id.startsWith('CVE-')) : null,
                      vulnRange: vuln.vulnerable_version_range || 'Unknown'
                    });
                  }
                }
              }

              if (rawVulns.length === 0) return;

              // Filter duplikat
              const uniqueVulns = [];
              const seen = new Set();
              for (const v of rawVulns) {
                const key = `${v.pkg}-${v.ghsa || v.cve || 'unknown'}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  uniqueVulns.push(v);
                }
              }

              console.log(`⚠️ Menemukan ${uniqueVulns.length} kerentanan unik! Memulai fetch Advisory API...`);

              let createdIssueNumbers = [];

              for (const vuln of uniqueVulns) {
                let ghsa = vuln.ghsa;
                let cveFallback = vuln.cve;
                const pkg = vuln.pkg;
                const prIntro = `🚨 **Dependency Review Alert:** Kerentanan diperkenalkan melalui PR #${prNumber} oleh @${prAuthor}.\n\n`;
                
                let title = `Security Advisory: ${pkg} (${ghsa || cveFallback || 'Unknown ID'})`;
                let summaryDesc = prIntro + 'No description available.';
                let severity = 'UNKNOWN';
                let cvss = 'N/A';
                let vectorString = 'N/A';
                let cve = cveFallback || 'No CVE';
                let osvId = 'No Alt ID';
                let cweList = 'N/A';
                let vulnRange = vuln.vulnRange;
                let patched = 'None';

                // ==========================================
                // 3. FETCH KE GITHUB ADVISORY API (DENGAN FALLBACK GHSA -> CVE)
                // ==========================================
                let advFetched = false;
                try {
                  if (ghsa) {
                    console.log(`\n🔍 Mengambil data resmi via GHSA: ${ghsa}...`);
                    const advResponse = await github.request('GET /advisories/{ghsa_id}', { ghsa_id: ghsa });
                    applyAdvData(advResponse.data);
                    advFetched = true;
                  }
                } catch (e) {
                  console.log(`⚠️ Global API gagal via GHSA (${e.message}). Mencoba fallback via CVE...`);
                }

                if (!advFetched && cve !== 'No CVE') {
                  try {
                    console.log(`🔍 Mencari metadata via CVE ID: ${cve}...`);
                    const searchRes = await github.request('GET /advisories', { cve_id: cve });
                    if (searchRes.data && searchRes.data.length > 0) {
                      const data = searchRes.data[0];
                      if (data.ghsa_id) ghsa = data.ghsa_id.toUpperCase();
                      applyAdvData(data);
                      advFetched = true;
                      console.log(`✅ Data ditemukan via pencarian CVE ID!`);
                    }
                  } catch (err2) {
                    console.log(`⚠️ Pencarian via CVE juga gagal: ${err2.message}`);
                  }
                }

                function applyAdvData(advData) {
                  title = advData.summary ? advData.summary : title;
                  summaryDesc = advData.description ? (prIntro + advData.description) : summaryDesc;
                  severity = advData.severity ? advData.severity.toUpperCase() : severity;
                  cvss = advData.cvss && advData.cvss.score ? advData.cvss.score.toString() : cvss;
                  vectorString = advData.cvss && advData.cvss.vector_string ? advData.cvss.vector_string : vectorString;
                  cve = advData.cve_id ? advData.cve_id : cve;
                  cweList = advData.cwes && advData.cwes.length > 0 ? advData.cwes.map(c => `${c.cwe_id} (${c.name})`).join(', ') : cweList;

                  if (advData.vulnerabilities && advData.vulnerabilities.length > 0) {
                    let ranges = [];
                    let fixes = [];
                    advData.vulnerabilities.forEach(v => {
                      if (v.vulnerable_version_range) ranges.push(v.vulnerable_version_range);
                      if (v.first_patched_version) fixes.push(v.first_patched_version);
                    });
                    if (ranges.length > 0) vulnRange = ranges.join('\n  - ');
                    if (fixes.length > 0) patched = fixes.join(' / ');
                  }
                }

                function parseCvssVector(vector) {
                  if (!vector || vector === 'N/A') return '*Data metrik belum dipublikasikan oleh repositori database.*';
                  const map = {
                    'AV:N': 'Network', 'AV:A': 'Adjacent', 'AV:L': 'Local', 'AV:P': 'Physical',
                    'AC:L': 'Low', 'AC:H': 'High',
                    'PR:N': 'None', 'PR:L': 'Low', 'PR:H': 'High',
                    'UI:N': 'None', 'UI:R': 'Required',
                    'S:U': 'Unchanged', 'S:C': 'Changed',
                    'C:N': 'None', 'C:L': 'Low', 'C:H': 'High',
                    'I:N': 'None', 'I:L': 'Low', 'I:H': 'High',
                    'A:N': 'None', 'A:L': 'Low', 'A:H': 'High'
                  };
                  const parts = vector.replace(/^CVSS:3\.[01]\//, '').split('/');
                  let result = `**Vector:** \`${vector}\`\n`;
                  parts.forEach(p => {
                    const [k, v] = p.split(':');
                    if (map[`${k}:${v}`]) {
                      const name = k === 'AV' ? 'Attack vector' : k === 'AC' ? 'Attack complexity' : k === 'PR' ? 'Privileges required' : k === 'UI' ? 'User interaction' : k === 'S' ? 'Scope' : k === 'C' ? 'Confidentiality' : k === 'I' ? 'Integrity' : k === 'A' ? 'Availability' : k;
                      result += `- **${name}:** ${map[`${k}:${v}`]}\n`;
                    }
                  });
                  return result;
                }

                const cvssMetrics = parseCvssVector(vectorString);
                const advisoryLink = ghsa ? `https://github.com/advisories/${ghsa}` : (cve !== 'No CVE' ? `https://nvd.nist.gov/vuln/detail/${cve}` : prUrl);

                // ==========================================
                // 4. RANGKAI ULANG BODY (Template Sync)
                // ==========================================
                const body = `## 🛡️ Security Vulnerability (from ${botType} PR #${prNumber})

                ### Description
                ${summaryDesc}
                
                ### Severity Check
                - ${severity === 'LOW' ? '☑' : '☐'} Low
                - ${severity === 'MODERATE' ? '☑' : '☐'} Moderate
                - ${severity === 'HIGH' ? '☑' : '☐'} High
                - ${severity === 'CRITICAL' ? '☑' : '☐'} Critical
                
                ### Severity Score
                ${cvss} / 10

                ### CVSS v3 Base Metrics
                ${cvssMetrics}
                
                ### Identifiers
                - **GHSA ID:** ${ghsa || 'N/A'}
                - **CVE ID:** ${cve}
                - **Alt ID (OSV/Snyk):** ${osvId}
                
                ### Weaknesses
                - ${cweList}
                
                ### Affected
                - **Package:** ${pkg}
                - **Affected versions:**
                  - ${vulnRange}
                - **Patched versions:** ${patched}
                
                ### References
                - Advisory: ${advisoryLink}
                - PR: ${prUrl}
                
                ---
                _Auto-generated from ${botType}. Fix by removing or updating the vulnerable package in PR #${prNumber}._`;

                let targetSeverityLabel = 'Low';
                if (severity === 'CRITICAL') targetSeverityLabel = 'Critical';
                else if (severity === 'HIGH') targetSeverityLabel = 'High';
                else if (severity === 'MODERATE') targetSeverityLabel = 'Moderate';

                const issues = await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, state: 'all', labels: 'Auto Create Issues', per_page: 100
                });
                const existing = issues.find(i => i.title === title || (ghsa && i.body.includes(ghsa)) || (cve !== 'No CVE' && i.body.includes(cve)));

                let issueNumber = null;

                if (!existing) {
                  const createdIssue = await github.rest.issues.create({
                    owner, repo, title, body,
                    labels: ['Security', 'Auto Create Issues', 'dependencies', targetSeverityLabel],
                    assignees: ['TheKingTermux'], milestone: 1
                  });
                  issueNumber = createdIssue.data.number;
                  console.log(`Created issue #${issueNumber}: ${title}`);
                } else {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number,
                    body, state: 'open', milestone: 1
                  });
                  
                  const currentLabels = existing.labels.map(l => l.name);
                  const severityPool = ['Low', 'Moderate', 'High', 'Critical'];
                  const wrongSeverityLabels = currentLabels.filter(l => severityPool.includes(l) && l !== targetSeverityLabel);

                  for (const wrongLabel of wrongSeverityLabels) {
                    try {
                      await github.rest.issues.removeLabel({ owner, repo, issue_number: existing.number, name: wrongLabel });
                    } catch (e) {}
                  }

                  if (!currentLabels.includes(targetSeverityLabel)) {
                    await github.rest.issues.addLabels({ owner, repo, issue_number: existing.number, labels: [targetSeverityLabel] });
                  }
                  
                  issueNumber = existing.number;
                  console.log(`Updated issue #${issueNumber}: ${title}`);
                }

                if (issueNumber && !createdIssueNumbers.includes(issueNumber)) {
                  createdIssueNumbers.push(issueNumber);
                }
              }

              // =================================================================
              // 5. UPDATE DESKRIPSI PR HANYA SEKALI (DIGABUNG JADI SATU BARIS)
              // =================================================================
              if (createdIssueNumbers.length > 0) {
                const prData = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                const currentPrBody = prData.data.body || '';

                const closingString = createdIssueNumbers.map(num => `Closes #${num}`).join(', ');
                const taskBlock = `**🛡️ Auto-linked Security Task:** ${closingString}`;

                if (!currentPrBody.includes('**🛡️ Auto-linked Security Task:**')) {
                  await github.rest.pulls.update({ 
                    owner, repo, pull_number: prNumber, 
                    body: currentPrBody + `\n\n---\n${taskBlock}` 
                  });
                  console.log(`✅ Berhasil menyematkan tautan gabungan: ${closingString}`);
                } else {
                  const updatedPrBody = currentPrBody.replace(/\*\*🛡️ Auto-linked Security Task:\*\*.*?(?=\n\n|$)/s, taskBlock);
                  if (updatedPrBody !== currentPrBody) {
                    await github.rest.pulls.update({ 
                      owner, repo, pull_number: prNumber, 
                      body: updatedPrBody 
                    });
                    console.log(`🔄 Memperbarui tautan gabungan Isu pada PR: ${closingString}`);
                  }
                }
              }

            } catch (err) {
              console.error(`❌ Gagal mengekstrak kerentanan: ${err.message}`);
            }
