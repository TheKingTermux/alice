name: 'Dependency Review & Security Alert'
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }} # Pastikan pakai client-id agar tidak deprecation
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # 1. JALANKAN PENJAGA GERBANG
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
        env:
          # Mengalihkan token pemindaian agar menggunakan identitas bot pribadi
          GITHUB_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          fail-on-severity: low # Akan langsung menggagalkan PR jika ada kerentanan apa pun

      # 2. JIKA GAGAL: Ekstrak kerentanan dan otomatis buat Issue
      - name: Extract Vuln & Auto Create Issue
        if: failure() # ⚠️ Baris ini wajib, agar skrip hanya jalan kalau step review di atas merah/gagal
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const payload = context.payload;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const prNumber = payload.pull_request.number;
            const prUrl = payload.pull_request.html_url;
            const prAuthor = payload.pull_request.user.login;
            const baseSha = payload.pull_request.base.sha;
            const headSha = payload.pull_request.head.sha;

            console.log(`🔍 Memindai grafik kerentanan antara ${baseSha} dan ${headSha}...`);

            try {
              // Menarik data perbandingan dependensi langsung dari API GitHub
              const compare = await github.request('GET /repos/{owner}/{repo}/dependency-graph/compare/{basehead}', {
                owner,
                repo,
                basehead: `${baseSha}...${headSha}`
              });

              let rawVulns = [];
              
              // Ekstrak semua paket yang membawa kerentanan
              for (const dep of compare.data) {
                if (dep.vulnerabilities && dep.vulnerabilities.length > 0) {
                  for (const vuln of dep.vulnerabilities) {
                    rawVulns.push({
                      pkg: dep.name,
                      ghsa: vuln.advisory_ghsa_id,
                      severity: vuln.severity,
                      summary: vuln.advisory_summary,
                      vulnRange: vuln.vulnerable_version_range || 'Unknown'
                    });
                  }
                }
              }

              if (rawVulns.length === 0) {
                console.log("✅ Tidak ada kerentanan aktif yang terbaca oleh API.");
                return;
              }

              // Filter duplikat agar tidak spam tiket Issue untuk paket yang sama
              const uniqueVulns = [];
              const seen = new Set();
              for (const v of rawVulns) {
                const key = `${v.pkg}-${v.ghsa}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  uniqueVulns.push(v);
                }
              }

              console.log(`⚠️ Menemukan ${uniqueVulns.length} kerentanan unik! Mengeksekusi pembuatan Issue...`);

              for (const vuln of uniqueVulns) {
                let ghsa = vuln.ghsa.toUpperCase();
                let pkg = vuln.pkg;
                let cve = 'No CVE';
                let osvId = 'No Alt ID';
                let vulnRange = vuln.vulnRange;
                
                let severity = vuln.severity ? vuln.severity.toUpperCase() : 'UNKNOWN';
                let cvss = 'N/A';
                let vectorString = 'N/A';
                let title = `Security Advisory: ${pkg} (${ghsa})`;
                let summaryDesc = `🚨 **Dependency Review Alert:** Kerentanan diperkenalkan melalui PR #${prNumber} oleh @${prAuthor}.\n\n${vuln.summary}`;
                let cweList = 'N/A';
                let patched = 'None';
                const botType = 'Dependency Review';

                // Fetch Ganda ke Public API
                try {
                  console.log(`🔍 Mengambil data kerentanan resmi untuk ${ghsa} via Public API...`);
                  const advResponse = await fetch(`https://api.github.com/advisories/${ghsa}`);
                  
                  if (advResponse.ok) {
                    const advData = await advResponse.json();
                    
                    if (advData.summary) title = `Security: ${severity} - ${pkg} (${ghsa})`;
                    if (advData.cvss && advData.cvss.score) cvss = advData.cvss.score.toString();
                    if (advData.cvss && advData.cvss.vector_string) vectorString = advData.cvss.vector_string;
                    if (advData.cve_id) cve = advData.cve_id;

                    if (advData.cwes && advData.cwes.length > 0) {
                      cweList = advData.cwes.map(c => `${c.cwe_id} (${c.name})`).join(', ');
                    }

                    if (advData.vulnerabilities && advData.vulnerabilities.length > 0) {
                      let ranges = [];
                      let fixes = [];
                      advData.vulnerabilities.forEach(v => {
                        if (v.vulnerable_version_range) ranges.push(v.vulnerable_version_range);
                        if (v.first_patched_version) fixes.push(v.first_patched_version);
                      });
                      if (ranges.length > 0) vulnRange = ranges.join('\n  - ');
                      if (fixes.length > 0) patched = fixes.join(' / ');
                    }
                    console.log(`✅ Data berhasil diamankan dari Public API.`);
                  }
                } catch (apiError) {
                  console.log(`⚠️ Gagal fetch Public API (${apiError.message}).`);
                }

                // Parser CVSS
                function parseCvssVector(vector) {
                  if (!vector || vector === 'N/A') return '*Data metrik belum dipublikasikan oleh repositori database.*';
                  const map = {
                    'AV:N': 'Network', 'AV:A': 'Adjacent', 'AV:L': 'Local', 'AV:P': 'Physical',
                    'AC:L': 'Low', 'AC:H': 'High',
                    'PR:N': 'None', 'PR:L': 'Low', 'PR:H': 'High',
                    'UI:N': 'None', 'UI:R': 'Required',
                    'S:U': 'Unchanged', 'S:C': 'Changed',
                    'C:N': 'None', 'C:L': 'Low', 'C:H': 'High',
                    'I:N': 'None', 'I:L': 'Low', 'I:H': 'High',
                    'A:N': 'None', 'A:L': 'Low', 'A:H': 'High'
                  };
                  const parts = vector.replace(/^CVSS:3\.[01]\//, '').split('/');
                  let result = `**Vector:** \`${vector}\`\n`;
                  parts.forEach(p => {
                    const [k, v] = p.split(':');
                    if (map[`${k}:${v}`]) {
                      const name = k === 'AV' ? 'Attack vector' : k === 'AC' ? 'Attack complexity' : k === 'PR' ? 'Privileges required' : k === 'UI' ? 'User interaction' : k === 'S' ? 'Scope' : k === 'C' ? 'Confidentiality' : k === 'I' ? 'Integrity' : k === 'A' ? 'Availability' : k;
                      result += `- **${name}:** ${map[`${k}:${v}`]}\n`;
                    }
                  });
                  return result;
                }

                const cvssMetrics = parseCvssVector(vectorString);

                // Labelisasi
                let issueLabels = ['Security', 'Auto Create Issues', 'dependencies'];
                let severityLabel = 'Low';
                if (severity === 'CRITICAL') severityLabel = 'Critical';
                else if (severity === 'HIGH') severityLabel = 'High';
                else if (severity === 'MODERATE') severityLabel = 'Moderate';
                else severity = 'LOW';
                issueLabels.push(severityLabel);

                const issues = await github.paginate(
                  github.rest.issues.listForRepo,
                  { owner, repo, state: 'all', labels: 'Auto Create Issues', per_page: 100 }
                );
                const existing = issues.find(i => i.title === title);

                const body = `## 🛡️ Security Vulnerability (from PR #${prNumber})

            ### Description
            ${summaryDesc}
            
            ### Severity Check
            - ${severity === 'LOW' ? '☑' : '☐'} Low
            - ${severity === 'MODERATE' ? '☑' : '☐'} Moderate
            - ${severity === 'HIGH' ? '☑' : '☐'} High
            - ${severity === 'CRITICAL' ? '☑' : '☐'} Critical
            
            ### Severity Score
            ${cvss} / 10

            ### CVSS v3 Base Metrics
            ${cvssMetrics}
            
            ### Identifiers
            - **GHSA ID:** ${ghsa}
            - **CVE ID:** ${cve}
            - **Alt ID (OSV/Snyk):** ${osvId}
            
            ### Weaknesses
            - ${cweList}
            
            ### Affected
            - **Package:** ${pkg}
            - **Affected versions:**
              - ${vulnRange}
            - **Patched versions:** ${patched}
            
            ### References
            - Advisory: https://github.com/advisories/${ghsa}
            - PR: ${prUrl}
            
            ---
            _Auto-generated from ${botType}. Fix by removing or updating the vulnerable package in PR #${prNumber}._`;

                let issueNumber = null;

                if (!existing) {
                  const createdIssue = await github.rest.issues.create({
                    owner, repo, title, body,
                    labels: issueLabels, assignees: ['TheKingTermux'], milestone: 1
                  });
                  issueNumber = createdIssue.data.number;
                  console.log(`Created issue #${issueNumber}: ${title}`);
                } else {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number,
                    body, state: 'open', milestone: 1
                  });
                  const currentLabels = existing.labels.map(l => l.name);
                  const missingLabels = issueLabels.filter(l => !currentLabels.includes(l));
                  if (missingLabels.length > 0) {
                    await github.rest.issues.addLabels({ owner, repo, issue_number: existing.number, labels: missingLabels });
                  }
                  issueNumber = existing.number;
                  console.log(`Updated issue #${issueNumber}: ${title}`);
                }

                if (issueNumber) {
                  const prData = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                  const currentPrBody = prData.data.body || '';
                  const closingKeywordRegex = new RegExp(`(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\\s+#${issueNumber}\\b`, 'i');
                  
                  if (!closingKeywordRegex.test(currentPrBody)) {
                    await github.rest.pulls.update({ 
                      owner, repo, pull_number: prNumber, 
                      body: currentPrBody + `\n\n---\n**🛡️ Auto-linked Security Task:** Closes #${issueNumber}` 
                    });
                  }
                }
              }
            } catch (err) {
              console.error(`❌ Gagal mengekstrak kerentanan dari Dependency Graph API: ${err.message}`);
            }
