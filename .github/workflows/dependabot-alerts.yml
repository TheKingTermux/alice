name: 'Dependabot Alerts Sync to Issues'

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Scan Dependabot Alerts & Create/Update Issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const botType = 'Dependabot Alert';

            console.log(`🔍 Memindai pusat komando Dependabot Alerts di repositori...`);

            try {
              const alerts = await github.paginate('GET /repos/{owner}/{repo}/dependabot/alerts', {
                owner, repo, state: 'open', per_page: 100
              });

              if (alerts.length === 0) {
                console.log("✅ Hutan aman! Tidak ada alert terbuka.");
                return;
              }

              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'all', labels: 'Auto Create Issues', per_page: 100
              });

              for (const alert of alerts) {
                const alertNumber = alert.number;
                const alertUrl = alert.html_url; 
                const pkg = alert.dependency.package.name;
                
                // Ambil GHSA atau fallback ke CVE dari objek alert
                const advisoryObj = alert.security_advisory || {};
                let ghsa = advisoryObj.ghsa_id ? advisoryObj.ghsa_id.toUpperCase() : null;
                let cve = advisoryObj.cve_id ? advisoryObj.cve_id.toUpperCase() : 'No CVE';

                console.log(`\n⏳ Memproses Alert #${alertNumber} - ${pkg} (GHSA: ${ghsa || 'N/A'}, CVE: ${cve})...`);

                // 1. Set Nilai Awal dari Bawaan Alert
                let title = advisoryObj.summary || `Security Advisory: ${pkg}`;
                let descText = advisoryObj.description || 'No description available.';
                let severity = advisoryObj.severity ? advisoryObj.severity.toUpperCase() : 'UNKNOWN';
                let cvss = 'N/A';
                let vectorString = 'N/A';
                let osvId = 'No Alt ID';
                let cweList = 'N/A';
                let vulnRange = '- `Unknown`';
                let patched = '- `None`';
                let advisoryLink = ghsa ? `https://github.com/advisories/${ghsa}` : (cve !== 'No CVE' ? `https://nvd.nist.gov/vuln/detail/${cve}` : alertUrl);

                // ==========================================
                // 2. FETCH KE API GITHUB ADVISORY (DENGAN FALLBACK GHSA -> CVE)
                // ==========================================
                let advFetched = false;
                try {
                  if (ghsa) {
                    console.log(`🔍 Menarik metadata resmi via GHSA: ${ghsa}...`);
                    const advResponse = await github.request('GET /advisories/{ghsa_id}', { ghsa_id: ghsa });
                    applyAdvData(advResponse.data);
                    advFetched = true;
                  }
                } catch (e) {
                  console.log(`⚠️ Global API gagal via GHSA (${e.message}). Mencoba fallback via CVE...`);
                }

                // Jika GHSA gagal atau kosong, coba cari via CVE ID di Global Database
                if (!advFetched && cve !== 'No CVE') {
                  try {
                    console.log(`🔍 Mencari metadata via CVE ID: ${cve}...`);
                    const searchRes = await github.request('GET /advisories', { cve_id: cve });
                    if (searchRes.data && searchRes.data.length > 0) {
                      const data = searchRes.data[0];
                      if (data.ghsa_id) ghsa = data.ghsa_id.toUpperCase();
                      applyAdvData(data);
                      advFetched = true;
                      console.log(`✅ Data ditemukan via pencarian CVE ID!`);
                    }
                  } catch (err2) {
                    console.log(`⚠️ Pencarian via CVE juga gagal: ${err2.message}`);
                  }
                }

                // Helper untuk menerapkan data dari API (Mendukung CVSS v3 & v4)
                function applyAdvData(advData) {
                  title = advData.summary || title;
                  descText = advData.description || descText;
                  severity = advData.severity ? advData.severity.toUpperCase() : severity;
                  cve = advData.cve_id || cve;
                  if (advData.html_url) advisoryLink = advData.html_url;

                  if (advData.cvss && advData.cvss.score) cvss = advData.cvss.score.toString();
                  if (advData.cvss && advData.cvss.vector_string) {
                    vectorString = advData.cvss.vector_string;
                  } else if (advData.cvss && advData.cvss.vector) {
                    vectorString = advData.cvss.vector;
                  }

                  if (advData.cwes && advData.cwes.length > 0) {
                    cweList = advData.cwes.map(c => `- **${c.cwe_id}**: ${c.name}`).join('\n');
                  }

                  if (advData.vulnerabilities && advData.vulnerabilities.length > 0) {
                    let ranges = [];
                    let fixes = [];
                    advData.vulnerabilities.forEach(v => {
                      if (v.package && v.package.name === pkg) {
                        if (v.vulnerable_version_range) ranges.push('- `' + v.vulnerable_version_range + '`');
                        if (v.first_patched_version) fixes.push('- `' + v.first_patched_version + '`');
                      }
                    });
                    if (ranges.length > 0) vulnRange = ranges.join('\n  ');
                    if (fixes.length > 0) patched = fixes.join('\n  ');
                  }
                }

                if (severity === 'MEDIUM') severity = 'MODERATE';

                // Parser Vektor CVSS Universal (v3 & v4)
                function parseCvssVector(vector) {
                  if (!vector || vector === 'N/A') return '*Data metrik belum dipublikasikan oleh repositori database.*';
                  const map = { 
                    'AV:N':'Network', 'AV:A':'Adjacent', 'AV:L':'Local', 'AV:P':'Physical', 
                    'AC:L':'Low', 'AC:H':'High', 'AC:M':'Medium',
                    'AT:N':'None', 'AT:P':'Present', 'AT:D':'Deferred',
                    'PR:N':'None', 'PR:L':'Low', 'PR:H':'High', 
                    'UI:N':'None', 'UI:R':'Required', 'UI:A':'Active',
                    'VC:N':'None', 'VC:L':'Low', 'VC:H':'High',
                    'VI:N':'None', 'VI:L':'Low', 'VI:H':'High',
                    'VA:N':'None', 'VA:L':'Low', 'VA:H':'High',
                    'SC:N':'None', 'SC:L':'Low', 'SC:H':'High',
                    'SI:N':'None', 'SI:L':'Low', 'SI:H':'High',
                    'SA:N':'None', 'SA:L':'Low', 'SA:H':'High',
                    'S:U':'Unchanged', 'S:C':'Changed', 
                    'C:N':'None', 'C:L':'Low', 'C:H':'High', 
                    'I:N':'None', 'I:L':'Low', 'I:H':'High', 
                    'A:N':'None', 'A:L':'Low', 'A:H':'High' 
                  };

                  const cleanVector = vector.replace(/^CVSS:[34]\.[01]\//, '');
                  const parts = cleanVector.split('/');
                  let result = `**Vector:** \`${vector}\`\n`;

                  parts.forEach(p => {
                    const [k, v] = p.split(':');
                    const lookupKey = k + ':' + v;
                    if (map[lookupKey]) {
                      let name = k;
                      if (k === 'AV') name = 'Attack vector';
                      else if (k === 'AC') name = 'Attack complexity';
                      else if (k === 'AT') name = 'Attack requirements';
                      else if (k === 'PR') name = 'Privileges required';
                      else if (k === 'UI') name = 'User interaction';
                      else if (k === 'VC') name = 'Vulnerable system confidentiality';
                      else if (k === 'VI') name = 'Vulnerable system integrity';
                      else if (k === 'VA') name = 'Vulnerable system availability';
                      else if (k === 'SC') name = 'Subsequent system confidentiality';
                      else if (k === 'SI') name = 'Subsequent system integrity';
                      else if (k === 'SA') name = 'Subsequent system availability';
                      else if (k === 'S') name = 'Scope';
                      else if (k === 'C') name = 'Confidentiality';
                      else if (k === 'I') name = 'Integrity';
                      else if (k === 'A') name = 'Availability';

                      result += `- **${name}:** ${map[lookupKey]}\n`;
                    }
                  });
                  return result;
                }

                const cvssMetrics = parseCvssVector(vectorString);

                // ==========================================
                // 3. RANGKAI ULANG BODY
                // ==========================================
                const body = `🚨 **Sumber Peringatan:** [Dependabot Alert #${alertNumber}](${alertUrl})

                ### Description
                ${descText}
                
                ### Severity Check
                - [${severity === 'LOW' ? 'x' : ' '}] Low
                - [${severity === 'MODERATE' ? 'x' : ' '}] Moderate
                - [${severity === 'HIGH' ? 'x' : ' '}] High
                - [${severity === 'CRITICAL' ? 'x' : ' '}] Critical
                
                ### Severity Score
                ${cvss} / 10

                ### CVSS v3/v4 Base Metrics
                ${cvssMetrics}
                
                ### Identifiers
                - **GHSA ID:** ${ghsa || 'N/A'}
                - **CVE ID:** ${cve}
                - **Alt ID (OSV/Snyk):** ${osvId}
                
                ### Weaknesses
                ${cweList !== 'N/A' ? cweList : '- N/A'}
                
                ### Affected
                - **Package:** \`${pkg}\`
                - **Affected versions:**
                  - ${vulnRange}
                - **Patched versions:**
                  - ${patched}
                
                ### References
                - Advisory: ${advisoryLink}
                
                ---
                _Auto-generated from ${botType}._`;

                let targetSeverityLabel = 'Low';
                if (severity === 'CRITICAL') targetSeverityLabel = 'Critical';
                else if (severity === 'HIGH') targetSeverityLabel = 'High';
                else if (severity === 'MODERATE') targetSeverityLabel = 'Moderate';

                // ==========================================
                // 4. MEMBUAT ATAU MEMPERBARUI ISSUE
                // ==========================================
                const existing = issues.find(i => i.body && i.body.includes(alertUrl));

                const defaultLabels = ['Security', 'Auto Create Issues', 'dependencies', 'Auto Sync', 'Auto Updated', 'Auto Re-Open', targetSeverityLabel];

                if (!existing) {
                  const createdIssue = await github.rest.issues.create({
                    owner, repo, title, body,
                    labels: defaultLabels,
                    assignees: ['TheKingTermux'], milestone: 1
                  });
                  console.log(`✅ Created issue #${createdIssue.data.number}: ${title}`);
                } else {
                  const isClosed = existing.state === 'closed';

                  if (existing.body !== body || existing.title !== title || isClosed) {
                    await github.rest.issues.update({
                      owner, repo, issue_number: existing.number,
                      title: title, body: body, state: 'open', milestone: 1
                    });
                    
                    if (isClosed) {
                      console.log(`🔓 Re-Opened issue #${existing.number}: ${title} (Alert terdeteksi masih aktif)`);
                    } else {
                      console.log(`🔄 Updated issue #${existing.number}: ${title} (Konten telah disinkronisasi)`);
                    }
                  } else {
                    console.log(`➖ Issue #${existing.number} sudah up-to-date dan open. Tidak ada pembaruan ditarik.`);
                  }
                  
                  const currentLabels = existing.labels.map(l => l.name);
                  const severityPool = ['Low', 'Moderate', 'High', 'Critical'];
                  const wrongSeverityLabels = currentLabels.filter(l => severityPool.includes(l) && l !== targetSeverityLabel);

                  for (const wrongLabel of wrongSeverityLabels) {
                    try { await github.rest.issues.removeLabel({ owner, repo, issue_number: existing.number, name: wrongLabel }); } catch (e) {}
                  }

                  if (currentLabels.includes('Sync')) {
                    try { 
                      await github.rest.issues.removeLabel({ owner, repo, issue_number: existing.number, name: 'Sync' }); 
                    } catch (e) {}
                  }

                  const requiredLabels = [targetSeverityLabel, 'Auto Sync', 'Auto Updated', 'Auto Re-Open'];
                  const labelsToAdd = requiredLabels.filter(l => !currentLabels.includes(l));

                  if (labelsToAdd.length > 0) {
                    await github.rest.issues.addLabels({ owner, repo, issue_number: existing.number, labels: labelsToAdd });
                    console.log(`🏷️ Label baru ditambahkan: ${labelsToAdd.join(', ')}`);
                  }
                }
              }

            } catch (err) {
              console.error(`❌ Gagal membaca atau memproses Dependabot Alerts: ${err.message}`);
            }
