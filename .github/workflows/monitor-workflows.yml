name: Monitor Semua Workflow

on:
  workflow_run:
    workflows: 
      - "Codeowners merging"
      - "Monitor Pull Requests"
      - "Monitor Issues"
      - "PR Merge Watcher"
      - "Security PR"
      - "Remove Unused Branches"
      - "Sync Security Advisories"
      - "Dependabot Auto Fixer"
      - "Dependabot Alerts Sync to Issues"
    types:
      - completed

permissions:
  actions: read

jobs:
  proses-dan-kirim-notifikasi:
  
    # PENGAMAN UTAMA: Mencegah workflow ini memicu dirinya sendiri (Infinite Loop)
    if: github.event.workflow_run.name != 'Monitor Semua Workflow'
    
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # STEP 1: CHECK DAN PISAHKAN SEMUA YANG JALAN & ERROR
      # ==========================================
      - name: Analisis dan Kelompokkan Status Workflow
        id: analyzer
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.payload.workflow_run.id;

            console.log("🔍 Memindai seluruh riwayat workflow run yang selesai dalam beberapa detik terakhir...");

            // Ambil daftar run workflow terbaru yang berstatus 'completed'
            const runsRes = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 25,
              status: 'completed'
            });

            // Cari run yang selesai dalam rentang waktu 60 detik terakhir agar bisa digabung
            const now = new Date();
            const recentRuns = runsRes.data.workflow_runs.filter(run => {
              // Abaikan workflow monitor ini sendiri
              if (run.name === 'Monitor Semua Workflow') return false;
              
              const updatedAt = new Date(run.updated_at);
              const diffSeconds = (now - updatedAt) / 1000;
              return diffSeconds <= 60; // Dikelompokkan jika selesai dalam waktu 60 detik terakhir
            });

            console.log(`✨ Ditemukan ${recentRuns.length} workflow yang baru saja selesai bersamaan.`);

            let successList = [];
            let failList = [];

            for (const run of recentRuns) {
              const wfName = run.name;
              const conclusion = run.conclusion; // success, failure, cancelled, skipped, dll.
              const runNum = run.run_number;
              const logUrl = run.html_url;
              const branch = run.head_branch || 'main';
              const eventType = run.event;

              if (conclusion === 'skipped' || conclusion === 'cancelled') {
                continue; // Lewatkan yang di-skip atau dibatalkan
              }

              const item = {
                name: wfName,
                run_number: runNum,
                url: logUrl,
                branch: branch,
                event: eventType
              };

              if (conclusion === 'success') {
                successList.push(item);
              } else {
                failList.push(item);
              }
            }

            console.log(`✅ Berhasil dikelompokkan -> Sukses: ${successList.length}, Gagal: ${failList.length}`);

            // Simpan ke output agar bisa dibaca di step berikutnya
            core.setOutput('has_success', successList.length > 0 ? 'true' : 'false');
            core.setOutput('has_fail', failList.length > 0 ? 'true' : 'false');
            
            // Simpan sebagai string JSON untuk diproses via jq di step selanjutnya
            fs = require('fs');
            fs.writeFileSync('success_payload.json', JSON.stringify(successList));
            fs.writeFileSync('fail_payload.json', JSON.stringify(failList));

      # ==========================================
      # STEP 2: KIRIM NOTIFIKASI YANG JALAN NORMAL (SUKSES)
      # ==========================================
      - name: Kirim Rangkuman Sukses ke Columbina
        if: steps.analyzer.outputs.has_success == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          SUCCESS_JSON=$(cat success_payload.json)
          REPO_NAME="${{ github.repository }}"
          
          # Buat daftar list teks markdown untuk embed Discord
          FIELDS=$(jq -n --argjson items "$SUCCESS_JSON" '[
            {
              name: "🏰 Sektor Repositori",
              value: ("`" + $items[0].branch + "`"),
              inline: false
            },
            {
              name: "✨ Melodi Alur Kerja yang Berhasil (" + ($items | length | tostring) + " Tugas)",
              value: [($items[] | "• **\(.name)** (Pertemuan #\(.run_number)) - [Lihat Log](\(.url))")] | join("\n"),
              inline: false
            }
          ]')

          jq -n \
            --arg title "♫~ Ah, keharmonisan yang indah..." \
            --arg desc "Semuanya berjalan dengan sangat damai, bagai melodi yang mengalun tanpa cela... Alur kerja kelompokmu menari dengan sempurna hari ini.~" \
            --arg color "16764142" \
            --arg footer "🕊️ 'Tidurlah dengan damai, biarkan malam menghapus air matamu...'" \
            --argjson fields "$FIELDS" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: $fields,
                footer: { text: $footer }
              }]
            }' > discord_success.json

          curl -H "Content-Type: application/json" -X POST -d @discord_success.json "$DISCORD_WEBHOOK"
          echo "📬 Rangkuman sukses berhasil dikirim!"

      # ==========================================
      # STEP 3: KIRIM NOTIFIKASI YANG ERROR (GAGAL)
      # ==========================================
      - name: Kirim Rangkuman Gagal ke Arlecchino
        if: steps.analyzer.outputs.has_fail == 'true'
        env:
          DISCORD_WEBHOOK_FAIL: ${{ secrets.DISCORD_WEBHOOK_FAIL }}
        run: |
          FAIL_JSON=$(cat fail_payload.json)
          
          FIELDS=$(jq -n --argjson items "$FAIL_JSON" '[
            {
              name: "🗺️ Sektor Repositori Target",
              value: ("`" + $items[0].branch + "`"),
              inline: false
            },
            {
              name: "🚨 Operasi Sistem yang Rusak (" + ($items | length | tostring) + " Gangguan)",
              value: [($items[] | "• **\(.name)** (Evaluasi #\(.run_number)) - [Investigasi](\(.url))")] | join("\n"),
              inline: false
            }
          ]')

          jq -n \
            --arg title "🩸 Laporan Kegagalan Massal: House of the Hearth" \
            --arg desc "Ada gangguan serius pada sistem kita. Beberapa alur kerja gagal menyelesaikan tugasnya secara bersamaan di bawah pengawasanku. Evaluasi segera!" \
            --arg color "10038562" \
            --arg footer "🐦‍⬛ 'Di dalam kegelapan, kedisiplinan adalah satu-satunya cahaya yang tersisa.'" \
            --argjson fields "$FIELDS" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: $fields,
                footer: { text: $footer }
              }]
            }' > discord_fail.json

          curl -H "Content-Type: application/json" -X POST -d @discord_fail.json "$DISCORD_WEBHOOK_FAIL"
          echo "📬 Rangkuman gagal berhasil dikirim!"
