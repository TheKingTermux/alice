name: 🛡️ Security PR → Auto Create/Update Issue

on:
  pull_request:
    types: [opened, synchronize, closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  process-security-pr:
    # 1. GERBANG DIBUKA: Terima semua PR Dependabot, ATAU PR Renovate yang judulnya ada 'security'
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.pull_request.user.login == 'renovate[bot]' && contains(github.event.pull_request.title, 'security'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract info & Create/Update Issue
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const payload = context.payload;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prBody = process.env.PR_BODY || payload.pull_request.body || '';
            const author = process.env.PR_AUTHOR || '';
            const botType = author === 'renovate[bot]' ? 'Renovate' : 'Dependabot';

            // 1. Ekstrak GHSA & CVE ID dasar dari deskripsi PR
            const ghsaMatch = prBody.match(/(GHSA[-a-zA-Z0-9]+)/i);
            let ghsa = ghsaMatch ? ghsaMatch[1].toUpperCase() : 'No GHSA';
            
            const cveMatch = prBody.match(/(CVE-\d{4}-\d+)/i);
            let cve = cveMatch ? cveMatch[1].toUpperCase() : 'No CVE';

            // Deteksi nama paket kerentanan
            let pkg = 'Unknown';
            const pkgMatch = process.env.PR_TITLE.match(/(?:bumps?|updates?)\s+(?:dependency\s+)?([^\s]+)/i) || 
                             prBody.match(/(?:bumps?|updates?)\s+(?:dependency\s+)?([^\s]+)\s+from/i);
            if (pkgMatch) pkg = pkgMatch[1];

            const depBlockMatch = prBody.match(/updated-dependencies:([\s\S]*?)(?=\n---|$)/);
            if (depBlockMatch) {
              const block = depBlockMatch[1];
              const nameMatch = block.match(/dependency-name:\s*["']?([^"'\n]+)["']?/);
              if (nameMatch && pkg === 'Unknown') pkg = nameMatch[1].trim();
            }

            // Inisialisasi variabel penampung data akurat dari API Advisory
            let severity = 'UNKNOWN';
            let cvss = 'N/A';
            let summary = `${botType} security update detected.`;
            let cweList = 'N/A';
            let vulnRange = 'Unknown';
            let patched = 'None';

            // 2. INVESTIGASI MANDIRI KE GITHUB ADVISORY API
            if (ghsa !== 'No GHSA') {
              try {
                console.log(`🔍 Mengambil data kerentanan resmi untuk ${ghsa} dari GitHub Advisory Database...`);
                const advisoryResponse = await github.rest.securityAdvisories.getGlobalAdvisory({
                  ghsa_id: ghsa
                });
                
                const advData = advisoryResponse.data;
                
                // Ambil data keparahan, deskripsi singkat, dan skor CVSS resmi
                if (advData.severity) severity = advData.severity.toUpperCase();
                if (advData.summary) summary = advData.summary;
                if (advData.cvss && advData.cvss.score) cvss = advData.cvss.score.toString();
                if (advData.cve_id) cve = advData.cve_id;

                // Ambil daftar kelemahan CWE
                if (advData.cwes && advData.cwes.length > 0) {
                  cweList = advData.cwes.map(c => `${c.cwe_id} (${c.name})`).join(', ');
                }

                // Ambil daftar versi terdampak & versi perbaikan secara dinamis
                if (advData.vulnerabilities && advData.vulnerabilities.length > 0) {
                  let ranges = [];
                  let fixes = [];
                  
                  advData.vulnerabilities.forEach(v => {
                    if (v.vulnerable_version_range) ranges.push(v.vulnerable_version_range);
                    if (v.first_patched_version) fixes.push(v.first_patched_version);
                  });

                  if (ranges.length > 0) vulnRange = ranges.join('\n              - ');
                  if (fixes.length > 0) patched = fixes.join(' / ');
                }
              } catch (apiError) {
                console.log(`⚠️ Gagal mengambil data Global Advisory (${apiError.message}). Menggunakan data fallback teks PR.`);
              }
            }

            // Pengecekan tingkat keparahan cadangan jika API gagal merespons
            if (severity === 'UNKNOWN') {
              const severityMatch = prBody.match(/\*\*Severity:\*\*\s*(\w+)/i) || prBody.match(/Severity:\s*(\w+)/i);
              if (severityMatch) severity = severityMatch[1].toUpperCase();
            }

            // FILTER ANTI-SPAM: Jika bukan PR keamanan, lewati pembuatan Issue
            if (botType === 'Dependabot' && severity === 'UNKNOWN' && ghsa === 'No GHSA' && cve === 'No CVE') {
              console.log('✅ PR Dependabot ini adalah update versi normal. Melewati pembuatan Issue...');
              return; 
            }

            // Normalisasi & Pembuatan Label Tingkat Keparahan
            let issueLabels = ['Security', 'Auto Create Issues', 'dependencies'];
            let severityLabel = 'Low';
            
            if (severity === 'CRITICAL') {
              severityLabel = 'Critical';
            } else if (severity === 'HIGH') {
              severityLabel = 'High';
            } else if (severity === 'MODERATE') {
              severityLabel = 'Moderate';
            }
            issueLabels.push(severityLabel);

            // Judul Issue Resmi
            const title = `Security: ${severity} - ${pkg} (${ghsa} / ${cve})`;

            // Cari Issue yang sudah ada di repositori
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'all', labels: 'Auto Create Issues', per_page: 100 }
            );
            const existing = issues.find(i => i.title === title);

            // 3. STRUKTUR FORMAT BARU PADA BODY ISSUE (MEMPERBAIKI CHECKBOX DAN PERTANYAAN ANDA)
            const body = `
              ## 🛡️ Security Vulnerability (from ${botType} PR #${process.env.PR_NUMBER})

              ### Description
              ${summary}

              ### Severity Check
              - ${severity === 'LOW' ? '☑' : '☐'} Low
              - ${severity === 'MODERATE' ? '☑' : '☐'} Moderate
              - ${severity === 'HIGH' ? '☑' : '☐'} High
              - ${severity === 'CRITICAL' ? '☑' : '☐'} Critical

              ### Severity Score
              ${cvss} / 10

              ### Identifiers
              - **GHSA ID:** ${ghsa}
              - **CVE ID:** ${cve}

              ### Weaknesses
              - ${cweList}

              ### Affected
              - **Package:** ${pkg}
              - **Affected versions:**
                - ${vulnRange}
              - **Patched versions:** ${patched}

              ### References
              - Advisory: https://github.com/advisories/${ghsa}
              - PR: ${process.env.PR_URL}

              ---
              _Auto-generated from ${botType} security PR. Fix by merging PR #${process.env.PR_NUMBER}._
            `.replace(/^ +/gm, '');

            // Eksekusi Pembuatan atau Pembaruan Tiket Issue
            if (payload.action === 'opened' || payload.action === 'synchronize' || payload.action === 'reopened') {
              if (!existing) {
                await github.rest.issues.create({
                  owner, repo,
                  title,
                  body,
                  labels: issueLabels,
                  assignees: ['TheKingTermux']
                });
                console.log(`Created issue: ${title}`);
              } else {
                await github.rest.issues.update({
                  owner, repo,
                  issue_number: existing.number,
                  body,
                  state: 'open'
                });
                const currentLabels = existing.labels.map(l => l.name);
                const missingLabels = issueLabels.filter(l => !currentLabels.includes(l));
                if (missingLabels.length > 0) {
                  await github.rest.issues.addLabels({
                    owner, repo,
                    issue_number: existing.number,
                    labels: missingLabels
                  });
                }
                console.log(`Updated issue: ${title}`);
              }
            }

            if (payload.action === 'closed' && existing) {
              const labels = existing.labels.map(l => l.name);
              if (!labels.includes('do-not-autoclose')) {
                await github.rest.issues.update({
                  owner, repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`Closed issue: ${title}`);
              }
            }
