name: Codeowners merging

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: read

    steps:
      # 1. Generate token sah dari bot pribadi Anda (thekingtermux-bot)
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # 2. Jalankan logika pengecekan Codeowners dan Auto-Merge langsung via skrip native
      - name: Auto Merge via Bot
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;

            console.log(`Memeriksa status otorisasi untuk PR #${pull_number}...`);

            // Ambil detail data PR terbaru
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            // Pastikan PR masih terbuka dan belum di-merge
            if (pr.data.state !== 'closed' && !pr.data.merged) {
              console.log(`Melakukan pengesahan dan penggabungan otomatis (Merge) untuk PR #${pull_number}...`);
              
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: 'merge', // Bisa diganti 'squash' atau 'rebase' sesuai selera
                commit_message: 'Otomatis: Merge Pull Request oleh Bot'
              });
              
              console.log(`Berhasil! PR #${pull_number} telah digabungkan.`);
            } else {
              console.log(`PR #${pull_number} sudah tertutup atau sudah di-merge.`);
            }
