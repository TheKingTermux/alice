name: Codeowners merging

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🤖 LANGKAH TAMBAHAN: Generate token khusus dari GitHub App bot pribadi Anda
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6
      
      - name: Run Codeowners merge check
        uses: OSS-Docs-Tools/code-owner-self-merge@1.6.8
        env:
          # Mengganti GITHUB_TOKEN bawaan dengan token bot pribadi
          GITHUB_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          path: '.github/CODEOWNERS' # Ensure this matches the location of your CODEOWNERS file
          author_name: TheKingTermux
          author_email: 50316075+TheKingTermux@users.noreply.github.com
          message: "Otomatis: Merge Pull Request"
