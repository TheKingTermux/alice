name: Codeowners merging

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: read

    steps:
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Run Codeowners merge check
        uses: OSS-Docs-Tools/code-owner-self-merge@1.6.8
        env:
          GITHUB_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          path: '.github/CODEOWNERS'

      - name: Auto Merge via Bot (Wait for LGTM / Approve / Request Changes)
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const payload = context.payload;
            const eventName = context.eventName;
            
            let shouldMerge = false;
            
            const pull_number = payload.pull_request ? payload.pull_request.number : (payload.issue ? payload.issue.number : null);
            
            if (!pull_number) {
              console.log("Bukan event Pull Request, melewati...");
              return;
            }

            console.log(`Menganalisis pemicu untuk PR #${pull_number}... (Event: ${eventName})`);

            // Ambil info pembuat PR (author)
            const prData = await github.rest.pulls.get({ owner, repo, pull_number });
            const prAuthor = prData.data.user.login;

            // 1. SKENARIO KOMEN: Cek apakah TheKingTermux komen "LGTM"
            if (eventName === 'issue_comment' && payload.action === 'created') {
              const commentBody = payload.comment.body.trim().toUpperCase();
              const commenter = payload.comment.user.login;
              
              if (commentBody.includes('LGTM') && commenter === 'TheKingTermux') {
                console.log("🟢 Titah 'LGTM' diterima dari sang Code Owner!");
                shouldMerge = true;
              } else {
                console.log(`Komen dari ${commenter} diabaikan (Bukan LGTM atau bukan TheKingTermux).`);
              }
            }

            // 2. SKENARIO REVIEW: Cek status Approve ATAU Request Changes
            if (eventName === 'pull_request_review' && payload.action === 'submitted') {
              const reviewState = payload.review.state.toLowerCase();
              const reviewer = payload.review.user.login;
              
              if (reviewer === 'TheKingTermux') {
                if (reviewState === 'approved') {
                  console.log("🟢 Restu 'Approve' diberikan oleh sang Code Owner!");
                  shouldMerge = true;
                } 
                // JIKA TERDETEKSI REQUEST CHANGES
                else if (reviewState === 'changes_requested') {
                  console.log("⚠️ Code Owner meminta perubahan kode (Changes Requested). Menyiapkan pemanggilan...");
                  
                  const alertMessage = `⚠️ **Review Update:** @${reviewer} meminta perubahan pada dahan kode ini!\n\nOi @${prAuthor}, mohon segera periksa kembali kiriman kontrak (PR) Anda dan lakukan perbaikan sesuai catatan yang diberikan. 🛠️`;
                  
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pull_number,
                    body: alertMessage
                  });
                  
                  console.log(`📢 Berhasil menandai @${prAuthor} dan @${reviewer} di kolom komentar.`);
                  return; // Hentikan script, tidak perlu lanjut ke proses merge
                }
              } else {
                console.log(`Review dari ${reviewer} dengan status '${reviewState}' diabaikan.`);
              }
            }

            // Kalau bukan perintah merge yang valid, berhentikan bot
            if (!shouldMerge) {
              console.log("⏳ Bot menahan diri. Menunggu tindakan lebih lanjut dari TheKingTermux...");
              return;
            }

            // Eksekusi Merge jika sudah mendapat restu
            if (prData.data.state !== 'closed' && !prData.data.merged) {
              console.log(`Mengeksekusi penggabungan (Merge) untuk PR #${pull_number}...`);
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number,
                  merge_method: 'merge',
                  commit_message: 'Otomatis: Merge Pull Request atas restu Code Owner'
                });
                console.log(`✅ Berhasil! PR #${pull_number} telah digabungkan.`);
              } catch (error) {
                console.log(`❌ Gagal melakukan merge: ${error.message}`);
              }
            }
