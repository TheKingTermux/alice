name: Codeowners merging

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: read

    steps:
      # 1. Amankan Token Bot Terlebih Dahulu dengan Benar
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # 2. Ambil Berkas Repositori
      - uses: actions/checkout@v7

      # 3. Validasi Pemilik Kode (Gunakan token bot agar punya hak bypass)
      - name: Run Codeowners merge check
        uses: OSS-Docs-Tools/code-owner-self-merge@1.6.8
        env:
          GITHUB_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          path: '.github/CODEOWNERS'

      # 4. Eksekusi Penggabungan Otomatis via API Script
      - name: Auto Merge via Bot
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            // Deteksi nomor PR baik dari event PR langsung atau dari komentar issue/PR
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;

            console.log(`Memeriksa status otorisasi untuk PR #${pull_number}...`);

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            if (pr.data.state !== 'closed' && !pr.data.merged) {
              console.log(`Melakukan penggabungan otomatis (Merge) untuk PR #${pull_number}...`);
              
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: 'merge',
                commit_message: 'Otomatis: Merge Pull Request oleh Bot'
              });
              
              console.log(`Berhasil! PR #${pull_number} telah digabungkan.`);
            } else {
              console.log(`PR #${pull_number} sudah tertutup atau sudah di-merge.`);
            }
