name: Remove Unused Branches

on:
  schedule:
    # Berjalan setiap tanggal 1 setiap bulannya pada pukul 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Generate Bot Token
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pembersihan Dahan Irminsul oleh Nahida
        env:
          GITHUB_TOKEN: ${{ steps.bot_token.outputs.token || secrets.GITHUB_TOKEN }}
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_PRUNE }}
        run: |
          echo "🌿 =========================================="
          echo " 🍃 Terminal Kesadaran Irminsul: Aktif"
          echo " 🌸 'Halo! Biar aku bantu rapikan ingatan dan"
          echo "    dahan-dahan kode yang sudah layu ya~'"
          echo "============================================"

          # 1. Ambil daftar branch remote terbaru
          git fetch --prune

          # 2. Ambil daftar branch yang saat ini memiliki PR berstatus 'open' dari GitHub API
          echo "🔍 Menghubungkan kesadaran untuk memindai PR yang masih terbuka..."
          OPEN_PR_BRANCHES=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            | jq -r '.[].head.ref')

          echo "Draf kontrak (PR aktif) yang ditemukan di dahan utama:"
          echo "$OPEN_PR_BRANCHES"
          echo "------------------------------------------"

          # Tempat penampung sementara file daftar branch
          echo -n "" > branch_list.txt
          DELETED_COUNT=0

          # 3. Loop melalui semua branch remote (mengabaikan prefix 'origin/')
          for remote_branch in $(git branch -r | grep -v 'HEAD' | sed 's|origin/||'); do
            branch=$(echo "$remote_branch" | xargs)

            # ATURAN AMAN: Jangan pernah hapus branch main, tester, atau branch saat ini
            if [ "$branch" = "main" ] || [ "$branch" = "tester" ] || [ "$branch" = "testing" ]; then
              echo "🌱 Melindungi dahan suci sumber kehidupan: $branch"
              continue
            fi

            is_in_open_pr=false
            if echo "$OPEN_PR_BRANCHES" | grep -qx "$branch"; then
              is_in_open_pr=true
            fi

            if [ "$is_in_open_pr" = "false" ]; then
              echo "✂️ Dahan '$branch' kehilangan ikatan dengan draf aktif. Memangkas memori lama..."
              if git push origin --delete "$branch"; then
                DELETED_COUNT=$((DELETED_COUNT + 1))
                echo "• \`$branch\`" >> branch_list.txt
              else
                echo "Gagal membersihkan dahan $branch (mungkin sudah gugur sebelumnya)."
              fi
            else
              echo "🍃 Dahan '$branch' dibiarkan tumbuh karena masih merajut kontrak aktif (PR Open)."
            fi
          done

          echo "============================================"
          echo "✨ Pembersihan Irminsul selesai!"
          echo "🌸 'Semua memori yang tidak berguna telah dibersihkan.'"
          echo "============================================"

          # 4. Amankan pengisian variabel multiline menggunakan fitur Heredoc GITHUB_ENV
          if [ $DELETED_COUNT -eq 0 ]; then
            echo "FIELD_VAL=*Tidak ada branch yang dihapus.*" >> $GITHUB_ENV
            echo "DESC<<EOF" >> $GITHUB_ENV
          🌸 **Laporan Pemangkasan Irminsul**

          Semua dahan kode masih bertunas dengan baik! Tidak ada branch tak terpakai yang perlu dipangkas kali ini.
          EOF
          else
            {
              echo "FIELD_VAL<<EOF"
              cat branch_list.txt
              echo "EOF"
            } >> $GITHUB_ENV

            {
              echo "DESC<<EOF"
              echo "🌸 **Laporan Pemangkasan Irminsul**"
              echo ""
              echo "Berhasil memangkas **$DELETED_COUNT** dahan/branch mati yang tidak terikat pada PR aktif."
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      - name: Kirim Notifikasi ke Discord
        if: env.DISCORD_URL != ''
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_PRUNE }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # ----------------------------------------------------
          # Adaptasi Logika "Kesaksian" Menjadi Versi Nahida
          # ----------------------------------------------------
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FIELD_TRIGGER_NAME="👤 Pengakses Terminal"
            FIELD_TRIGGER_VALUE="\`$ACTOR\` (Manual)"
          else
            FIELD_TRIGGER_NAME="⚙️ Siklus Samsara"
            FIELD_TRIGGER_VALUE="\`Jadwal Otomatis (Cron)\`"
          fi

          # Menggunakan env context shell secara native
          jq -n \
            --arg title "🌿 Pembersihan Dahan Irminsul Berkala" \
            --arg desc "$DESC" \
            --arg deleted_val "$FIELD_VAL" \
            --arg repo "${{ github.repository }}" \
            --arg trigger_name "$FIELD_TRIGGER_NAME" \
            --arg trigger_val "$FIELD_TRIGGER_VALUE" \
            --arg footer_text "💎 'Pengetahuan adalah kekuatan, bersihkan memori yang membebani.'" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 5832732,
                fields: [
                  { name: "📁 Repositori", value: ("`" + $repo + "`"), inline: true },
                  { name: $trigger_name, value: $trigger_val, inline: true },
                  { name: "✂️ Daftar Branch yang Dipangkas", value: $deleted_val, inline: false }
                ],
                footer: { text: $footer_text }
              }]
            }' > discord_prune_payload.json

          curl -H "Content-Type: application/json" -X POST -d @discord_prune_payload.json "$DISCORD_URL"
          echo "📬 Laporan rapi berhasil dikirim ke saluran Discord!"
